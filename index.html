<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reinos Bíblicos v18</title>
<style>
html,body{margin:0;height:100%;background:#15110d;color:#ecd9b0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#loading{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="loading"><div><h1>REINOS BÍBLICOS</h1><p>Cargando campaña v18…</p></div></div>
<script>
(async()=>{
  try{
    const files=[
      'game/p00.txt','game/p01.txt','game/p02.txt','game/p03.txt','game/p04.txt','game/p05.txt',
      'game/q00.txt','game/q01.txt','game/q02.txt','game/q03.txt','game/q04.txt','game/q05.txt',
      'game/q06.txt','game/q07.txt','game/q08.txt','game/q09.txt','game/q10.txt','game/q11.txt'
    ];
    const parts=await Promise.all(files.map(async f=>{
      const r=await fetch(f+'?rev=18fix1',{cache:'no-store'});
      if(!r.ok) throw new Error(`No se pudo cargar ${f}`);
      return (await r.text()).trim();
    }));
    const b64=parts.join('');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    let html=await new Response(stream).text();

    // Corrección v18: en el parche v13 algunas funciones fueron declaradas otra vez
    // con `function`, lo que provoca hoisting y hace que updateUI se ejecute antes
    // de que sus referencias previas estén inicializadas. Eso ocultaba la pantalla
    // inicial y dejaba el canvas negro al elegir un reino.
    const v13Start=html.indexOf('// v13 PATCH');
    const v14Start=html.indexOf('// v14 PATCH');
    if(v13Start>=0 && v14Start>v13Start){
      let before=html.slice(0,v13Start);
      let v13=html.slice(v13Start,v14Start);
      let after=html.slice(v14Start);
      v13=v13.replace('function totalProd(){','totalProd = function(){')
             .replace('function recruit(type){','recruit = function(type){')
             .replace('function fortify(){','fortify = function(){')
             .replace('function updateUI(){','updateUI = function(){');
      html=before+v13+after;
    }

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('loading').innerHTML=`<div><h1>Error al cargar</h1><p>${String(err)}</p></div>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
