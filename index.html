<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reinos Bíblicos v18</title>
<style>
html,body{margin:0;height:100%;background:#15110d;color:#ecd9b0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#loading{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="loading"><div><h1>REINOS BÍBLICOS</h1><p>Cargando campaña v18…</p></div></div>
<script>
(async()=>{
  try{
    const files=[
      'game/p00.txt','game/p01.txt','game/p02.txt','game/p03.txt','game/p04.txt','game/p05.txt',
      'game/q00.txt','game/q01.txt','game/q02.txt','game/q03.txt','game/q04.txt','game/q05.txt',
      'game/q06.txt','game/q07.txt','game/q08.txt','game/q09.txt','game/q10.txt','game/q11.txt'
    ];
    const parts=await Promise.all(files.map(async f=>{
      const r=await fetch(f+'?rev=18fix2',{cache:'no-store'});
      if(!r.ok) throw new Error(`No se pudo cargar ${f}`);
      return (await r.text()).trim();
    }));
    const b64=parts.join('');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    let html=await new Response(stream).text();

    // v13: corregir declaraciones de funciones que causaban hoisting/TDZ.
    const v13Start=html.indexOf('// v13 PATCH');
    const v14Start=html.indexOf('// v14 PATCH');
    if(v13Start>=0 && v14Start>v13Start){
      let before=html.slice(0,v13Start);
      let v13=html.slice(v13Start,v14Start);
      let after=html.slice(v14Start);
      v13=v13.replace('function totalProd(){','totalProd = function(){')
             .replace('function recruit(type){','recruit = function(type){')
             .replace('function fortify(){','fortify = function(){')
             .replace('function updateUI(){','updateUI = function(){');
      html=before+v13+after;
    }

    // v14: varias funciones que extendían sistemas anteriores se declararon con
    // `function`. El hoisting hacía que drawShips/drawCheckpoint se capturaran a
    // sí mismas y entraran en recursión infinita. Eso detenía el render justo
    // antes de drawMini(), dejando el minimapa oscuro y la cámara sin refrescar.
    const a14=html.indexOf('// v14 PATCH');
    const a15=html.indexOf('// v15 PATCH');
    if(a14>=0 && a15>a14){
      let before=html.slice(0,a14);
      let v14=html.slice(a14,a15);
      let after=html.slice(a15);
      const fixes=[
        ['function selectedInfo(){','selectedInfo = function(){'],
        ['function updateArmyMotion(dt){','updateArmyMotion = function(dt){'],
        ['function drawShips(){','drawShips = function(){'],
        ['function drawCheckpoint(cp){','drawCheckpoint = function(cp){'],
        ['function drawCity(c){','drawCity = function(c){'],
        ['function drawArmy(a){','drawArmy = function(a){'],
        ['function render(){','render = function(){'],
        ['function renderBattle(){','renderBattle = function(){'],
        ['function tick(){','tick = function(){']
      ];
      for(const [oldText,newText] of fixes) v14=v14.replace(oldText,newText);
      html=before+v14+after;
    }

    // Mejorar interacción y asegurar que el minimapa quede por encima de ayudas.
    html=html.replace('canvas#game{display:block;','canvas#game{touch-action:none;display:block;')
             .replace('#miniWrap{position:absolute;','#miniWrap{z-index:25;position:absolute;');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('loading').innerHTML=`<div><h1>Error al cargar</h1><p>${String(err)}</p></div>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
